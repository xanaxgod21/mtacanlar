name: Build Ticket Bildirim EXE

# Windows makinede ticket_bildirim.py'yi tek dosyalik .exe olarak derler
# ve sonucu indirilebilir artifact olarak yukler.

on:
  workflow_dispatch:      # Actions sekmesinden elle calistirilir
  push:
    branches:
      - claude/optimistic-einstein-8g17cw
    paths:
      - ticket_bildirim.py
      - assets/**
      - .github/workflows/build-ticket-exe.yml

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller discord.py customtkinter pillow

      - name: Build EXE
        run: pyinstaller --onefile --windowed --collect-data customtkinter --add-data "assets/arka_plan.jpg;assets" --add-data "assets/bildirim.wav;assets" --name ticket_bildirim ticket_bildirim.py

      - name: Toast smoke test
        continue-on-error: true
        shell: python
        run: |
          import importlib.util, threading, winreg
          spec = importlib.util.spec_from_file_location("t", "ticket_bildirim.py")
          t = importlib.util.module_from_spec(spec); spec.loader.exec_module(t)
          errs = []
          t.windows_toast("Yeni ticket acildi", "#ticket-0001 - test", "discord://-/channels/1/2", report=errs.append)
          for th in threading.enumerate():
              if th is not threading.current_thread():
                  th.join(60)
          key = winreg.OpenKey(winreg.HKEY_CURRENT_USER, "Software\\Classes\\AppUserModelId\\" + t.TOAST_APP_ID)
          print("registered:", winreg.QueryValueEx(key, "DisplayName")[0])
          print("errors:", errs)
          print("sound:", t.sound_path())
          assert not errs

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ticket_bildirim-windows
          path: dist/ticket_bildirim.exe
