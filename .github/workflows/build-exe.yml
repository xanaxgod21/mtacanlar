name: Build EXE

# Windows makinede isim_uretici.py'yi tek dosyalik .exe olarak derler
# ve sonucu indirilebilir artifact olarak yukler.

on:
  workflow_dispatch:      # Actions sekmesinden elle calistirilir
  push:
    branches:
      - claude/great-meitner-p1m9u7
    paths:
      - isim_uretici.py
      - .github/workflows/build-exe.yml

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --console --name isim_uretici isim_uretici.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: isim_uretici-windows
          path: dist/isim_uretici.exe
