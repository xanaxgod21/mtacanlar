name: Scarface Proxy Build

on:
  push:
    paths:
      - 'scarface-proxy/**'
      - '.github/workflows/scarface-build.yml'
  workflow_dispatch:
    inputs:
      buildType:
        description: "Build Type"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - MinSizeRel
      licensed:
        description: "Lisansli build (acilista key sorar)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-2022
    env:
      BUILD_TYPE: ${{ inputs.buildType || 'Release' }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Conan
        run: pip install "conan>2.0"

      - name: Configure CMake
        shell: pwsh
        run: |
          $cmakeArgs = @('-S','scarface-proxy','-B','build',"-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE")
          if ('${{ inputs.licensed }}' -eq 'true') {
            $cmakeArgs += '-DGTPROXY_LICENSE_SERVER=http://87.76.152.207:8080'
            $cmakeArgs += '-DGTPROXY_LICENSE_PUBLIC_KEY=d5fac7022654e67e496c1c0d8959177ff7f074ded7f17d80b40c49bf48b23689'
            Write-Host 'Building LICENSED (key required)'
          } else {
            Write-Host 'Building TEST (no license)'
          }
          cmake @cmakeArgs

      - name: Build proxy
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target ScarfaceProxy

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter ScarfaceProxy.exe | Select-Object -First 1
          if (-not $exe) { throw "ScarfaceProxy.exe not found under build" }
          Copy-Item $exe.FullName output
          $dir = $exe.Directory.FullName
          if (Test-Path "$dir\resources") { Copy-Item "$dir\resources" output -Recurse -Force }
          if (Test-Path "$dir\scripts")   { Copy-Item "$dir\scripts"   output -Recurse -Force }
          Get-ChildItem build -Recurse -Filter *.dll | Copy-Item -Destination output -Force
          Write-Host "Output contents:"
          Get-ChildItem output -Recurse | Select-Object FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScarfaceProxy-${{ env.BUILD_TYPE }}
          path: output
