name: Scarface Proxy Build

on:
  push:
    paths:
      - 'scarface-proxy/**'
      - '.github/workflows/scarface-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # test     = no license check (open without a key, for testing)
        # licensed = key required on every launch (the exe you hand to customers)
        variant: [test, licensed]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Conan
        run: pip install "conan>2.0"

      - name: Configure CMake
        shell: pwsh
        run: |
          $cmakeArgs = @('-S','scarface-proxy','-B','build','-DCMAKE_BUILD_TYPE=Release')
          if ('${{ matrix.variant }}' -eq 'licensed') {
            $cmakeArgs += '-DGTPROXY_LICENSE_SERVER=http://87.76.152.207:8080'
            $cmakeArgs += '-DGTPROXY_LICENSE_PUBLIC_KEY=d5fac7022654e67e496c1c0d8959177ff7f074ded7f17d80b40c49bf48b23689'
            Write-Host 'Variant: LICENSED (key required every launch)'
          } else {
            Write-Host 'Variant: TEST (no license)'
          }
          cmake @cmakeArgs

      - name: Build proxy
        run: cmake --build build --config Release --target ScarfaceProxy

      - name: Verify exe is standalone
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter ScarfaceProxy.exe | Select-Object -First 1
          if (-not $exe) { throw "ScarfaceProxy.exe not found under build" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) { Write-Host 'dumpbin not found, skipping dependency check'; exit 0 }

          $deps = & $dumpbin /DEPENDENTS $exe.FullName
          Write-Host 'Imported DLLs:'
          Write-Host ($deps -join "`n")

          # These must NOT appear: they would mean the exe needs a DLL that is not
          # on a clean Windows box (OpenSSL, the VC++ runtime, zlib, MinGW).
          $forbidden = 'libssl|libcrypto|vcruntime|msvcp\d|concrt|zlib1|libgcc|libstdc\+\+|openssl'
          $bad = $deps | Select-String -Pattern $forbidden
          if ($bad) {
            Write-Host "::error::Exe depends on non-system DLLs (not standalone):"
            Write-Host ($bad -join "`n")
            exit 1
          }
          Write-Host 'OK: exe only imports standard Windows system DLLs.'

      - name: Collect single exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter ScarfaceProxy.exe | Select-Object -First 1
          if (-not $exe) { throw "ScarfaceProxy.exe not found under build" }
          Copy-Item $exe.FullName output
          # Everything is linked statically, so there are normally no DLLs; copy
          # any that appear just in case. The exe writes resources/cert.pem and
          # resources/key.pem itself on first run, so nothing else is shipped.
          Get-ChildItem build -Recurse -Filter *.dll | Copy-Item -Destination output -Force
          Write-Host 'Artifact contents:'
          Get-ChildItem output -Recurse | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScarfaceProxy-${{ matrix.variant }}
          path: output
